name: Demo video
on:
  push:
    branches: [claude-alt-v1.1]
    paths: ['demo/**', '.github/workflows/demo.yml']
permissions:
  contents: write
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Tools
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg python3-pil
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator + record
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 demo/demo.py
      - name: Encode video
        if: always()
        run: |
          if [ -f demo_raw.mp4 ]; then
            ffmpeg -y -i demo_raw.mp4 -vf scale=540:-2 -c:v libx264 -crf 27 -preset veryfast -pix_fmt yuv420p -movflags +faststart demo.mp4
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-output
          path: |
            demo.mp4
            demo_debug.txt
            shot*.png
      - uses: softprops/action-gh-release@v2
        if: always() && (hashFiles('demo.mp4') != '' || hashFiles('demo_debug.txt') != '')
        with:
          tag_name: demo-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Demo video ${{ github.run_number }}
          prerelease: true
          files: |
            demo.mp4
            demo_debug.txt
            shot*.png
